[tox]
envlist = py{311, 312}-django{42, 52}, quality
requires = tox-uv>=1

[pytest]
DJANGO_SETTINGS_MODULE = test_settings
addopts = --cov src/edx_rest_api_client --cov-report term-missing --cov-report xml
norecursedirs = .* docs requirements

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
commands =
    pytest {posargs}

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = .
commands =
    pycodestyle --config=.pep8 src/edx_rest_api_client
    pylint --rcfile=pylintrc src/edx_rest_api_client
    python -m build
    twine check dist/*
